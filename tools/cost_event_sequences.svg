  <text x="319" y="1811" text-anchor="start" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#667283">≤ 0.659 ms · enclosing window</text>
  <text x="52" y="1900" text-anchor="start" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#667283">Logged send/reply intervals include scheduling, serialization, handling and transport; they are not isolated network latency.</text>
  <text x="52" y="1926" text-anchor="start" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#667283">The local and partitioned headlines use different boundaries. Exact local eval and partition/orchestration timers are absent from syslog.</text>
