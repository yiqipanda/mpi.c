  <text x="50" y="106" text-anchor="start" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#bdc7d4">Local and partitioned event sequences from one syslog run</text>
  <text x="1550" y="65" text-anchor="end" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#55c7ca">EVENT SEQUENCES</text>
