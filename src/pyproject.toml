[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mpi-c-ray-demo"
version = "0.1.0"
description = "Ray execution pilot for the existing matrix partition demo"
requires-python = ">=3.10,<3.15"
dependencies = ["ray[default]==2.59.0"]

[tool.setuptools]
py-modules = ["ray_demo", "matrix", "functions"]
